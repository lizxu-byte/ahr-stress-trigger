name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Unit tests (synthetic signals only, no WESAD data)
        run: pytest
      - name: Smoke test of the end-to-end script on synthetic data
        run: python scripts/run_all.py --synthetic 2 --out /tmp/ahr-smoke
